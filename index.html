<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exam marks dashboard</title>
<style>
:root{--bg:#f4f5f7;--sf:#fff;--tx:#1a1d24;--mu:#667085;--bd:#e1e4ea;--ac:#2f4fd1;--ok:#1f8a47;--wn:#c77700;--bad:#c92a5a;--okb:#e4f5ea;--wnb:#fdf0da;--badb:#fce7ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--sf:#1b1e24;--tx:#e8eaee;--mu:#9aa1ad;--bd:#2b2f37;--ac:#8aa0ff;--ok:#5fd087;--wn:#f0b04d;--bad:#ff7da6;--okb:#15301f;--wnb:#382a12;--badb:#391a26;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121418;--sf:#1b1e24;--tx:#e8eaee;--mu:#9aa1ad;--bd:#2b2f37;--ac:#8aa0ff;--ok:#5fd087;--wn:#f0b04d;--bad:#ff7da6;--okb:#15301f;--wnb:#382a12;--badb:#391a26;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0}h2{font-size:15px;margin:0 0 12px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.sub{color:var(--mu);font-size:13px}
.bar-f{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
select,button,input{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:7px 10px}
button{cursor:pointer}button.pri{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}
button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.k{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:12px}
.k b{display:block;font-size:22px;line-height:1.2}.k span{color:var(--mu);font-size:12.5px}
.k small{display:block;font-size:12px;color:var(--mu);margin-top:2px}
section{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:820px){.g2{grid-template-columns:1fr}}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:12.5px}td.n,th.n{text-align:right}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%}
.chip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.ok{color:var(--ok);background:var(--okb)}.wn{color:var(--wn);background:var(--wnb)}.bad{color:var(--bad);background:var(--badb)}
.clk{cursor:pointer}.clk:hover{background:var(--bg)}.det{display:none}.det.open{display:table-row}
.det td{white-space:normal;color:var(--mu);font-size:12.5px;background:var(--bg)}
.hist{display:flex;gap:8px;align-items:flex-end;height:130px}.hist div{flex:1;text-align:center;font-size:12px;color:var(--mu)}
.hist i{display:block;background:var(--ac);border-radius:4px 4px 0 0;margin-bottom:4px}
.mx{cursor:pointer}.mx:hover{background:var(--bg)}.msg{color:var(--bad);font-size:13px}.note{color:var(--mu);font-size:12.5px;margin:8px 0 0}
#ld{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}
#ld .lt{font-size:18px;font-weight:600}
#ld .lb{width:min(360px,80vw);height:10px;background:var(--bd);border-radius:6px;overflow:hidden}
#ld .lb i{display:block;height:100%;width:0;background:var(--ac);border-radius:6px;transition:width .15s linear}
#ld .lp{color:var(--mu);font-size:13px}
.fun{max-height:520px;overflow:auto}
</style></head><body>
<div id="ld" hidden role="status" aria-live="polite"><div class="lt" id="ltx">Data loading…</div><div class="lb"><i id="lbar"></i></div><div class="lp" id="lpc">0%</div></div>
<div id="login" hidden style="max-width:420px;margin:15vh auto;text-align:center;padding:16px"><h1>Exam marks dashboard</h1><p class="sub">Sign in with your work email and the shared password.</p><input id="em" type="email" placeholder="Work email" autocomplete="username" style="width:100%;margin-bottom:8px"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" style="width:100%;margin-bottom:8px"><button class="pri" id="sb" style="width:100%">Sign in</button><p class="msg" id="lmsg"></p></div>
<main id="app" hidden>
<div class="top"><div><h1>Exam marks dashboard</h1><div class="sub" id="meta"></div></div>
<div style="text-align:right"><div class="sub" id="who"></div><div style="margin-top:4px"><button id="rf">Refresh data</button> <button id="so">Sign out</button></div></div></div>
<div class="msg" id="err"></div>
<div class="bar-f"><select id="fEx" aria-label="Exam"></select><select id="fCa" aria-label="Campus"></select><select id="fBa" aria-label="Batch"></select><select id="fSm" aria-label="Semester"></select></div>
<div class="kpis" id="kpis"></div>
<section><h2>Student performance by semester</h2><div class="w" id="funnel"></div><p class="note" id="funNote"></p></section>
<section><h2>End term marks status</h2><div class="w" id="trkEnd"></div><p class="note">Tap a Subject-wise cell to filter the dashboard to that batch and exam.</p></section>
<section><h2>Mid term marks status</h2><div class="w" id="trkMid"></div></section>
<section><h2>Top performers</h2><div style="margin-bottom:8px"><button id="tTop" class="on">Top 10</button> <button id="tLow">Needs attention</button></div><div class="w" id="perf"></div></section>
</main>
<script>
let CUM=[],ROWS=[],F={exam:'all',campus:'all',batch:'all',sem:'all'},tab='top',fname='mid_sem_-_Sheet4.csv';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null,pc=v=>v==null?'–':v.toFixed(1)+'%';
const col=p=>p==null?'var(--mu)':p>=75?'var(--ok)':p>=50?'var(--ac)':p>=35?'var(--wn)':'var(--bad)';
const exL=e=>/^midterm_(\d+)$/.test(e)?e.replace(/^midterm_(\d+)$/,'Mid-term $1'):e==='endterm'?'End term':e;
const REQ=['id','Student_name','campus_name','admission_year','Semester','course_id','course_name','exam_type','obtained_grades_text','max_grades','Marks','cplm_id'];
const API_URL='https://script.google.com/macros/s/AKfycbx5wXN2u-Z0pun9zaxMVfUpxha3zqh_1TpNachmHYvOCWbmuNurnbr-Ecjg28SFzydhwQ/exec';
// [campus, batch year, current semester]: End term is tracked for semesters 1..N, Mid term only for N.
const PLAN_ALL=[['GDG',2023,7],['ADYPU',2024,5],['ADYPU',2025,3],['SSU',2024,5],['SSU',2025,3],['SAGE',2025,3],['SAGESELECT',2024,5],['VGUJ',2025,3]];
let PLAN=[],UPD=0,CRED=null;try{CRED=JSON.parse(sessionStorage.getItem('cr')||'null')}catch(e){}
const skf=(c,y,l)=>c+'|'+y+'|'+String(l).replace(/(semester|trimester)\s*/i,'S').trim();
function grp(a,f){const m=new Map();a.forEach(r=>{const k=f(r);if(!m.has(k))m.set(k,[]);m.get(k).push(r)});return m}
const canon=et=>/^midterm_\d+$/.test(et)?et:/end/i.test(et)?'endterm':et;
function normSub(d){return d.filter(r=>r.id).map(r=>{
 const m=(r.Marks||'').trim(),o=(r.obtained_grades_text||'').trim(),mx=parseFloat(r.max_grades),v=parseFloat(o);
 let st='scored';
 if(m==='Not Available'||o==='')st='pending';else if(m==='Incorrect')st='incorrect';
 else if(o.toUpperCase()==='AB')st='absent';else if(isNaN(v))st='incorrect';
 const sem=(r.Semester||'').replace('Semester ','Sem ');
 return{id:r.id,name:r.Student_name,campus:r.campus_name,bid:r.cplm_id,yr:r.admission_year,sm:sem,sk:skf(r.campus_name,r.admission_year,r.Semester),n:+((sem.match(/\d+/)||[0])[0]),bl:r.campus_name+' · '+r.admission_year+' batch',
  cid:r.course_id,course:(r.course_name||'').replace(/[\u2060\u200b]/g,'').replace(/ - Exam$/,'').trim(),ex:canon(r.exam_type||''),mx,st,pct:st==='scored'&&mx?v/mx*100:null}})}
function normCum(d){return d.filter(r=>r.student_id).map(r=>{
 const mx=parseFloat(r.max_grades),o=(r.obtained_grades_text||'').trim(),ok=(r.marks_status||'').trim()==='Available'&&o!==''&&!isNaN(parseFloat(o)),k=skf(r.campus,r.batch,r.semester_label);
 return{id:r.student_id,name:r.student_name,campus:r.campus,yr:r.batch,sk:k,bid:k,ex:canon(r.exam_type||''),st:ok?'scored':'pending',n:+((String(r.semester_label||'').match(/\d+/)||[0])[0]),v:ok&&mx>0?parseFloat(o)/mx*100:null}})}
function fill(s,list,v){const e=$(s);e.innerHTML=list.map(x=>`<option value="${esc(x[0])}">${esc(x[1])}</option>`).join('');e.value=list.some(x=>x[0]===v)?v:list[0][0]}
function opts(){
 const cs=new Map();PLAN.forEach(([c,y,m])=>cs.set(c+'|'+y,{c,y,m}));
 [...ROWS,...CUM].forEach(r=>{const k=r.campus+'|'+r.yr;if(!cs.has(k))cs.set(k,{c:r.campus,y:r.yr,m:0})});
 const co=[...cs.values()],cams=[...new Set(co.map(x=>x.c))].sort();
 fill('#fEx',[['all','All exams'],...[...new Set([...ROWS,...CUM].map(r=>r.ex))].sort().map(e=>[e,exL(e)])],F.exam);
 fill('#fCa',[['all','All campuses'],...cams.map(c=>[c,c])],F.campus);F.campus=$('#fCa').value;
 const bl=co.filter(x=>F.campus==='all'||x.c===F.campus).sort((a,b)=>a.c.localeCompare(b.c)||String(a.y).localeCompare(String(b.y)));
 fill('#fBa',[['all','All batches'],...bl.map(x=>[x.c+'|'+x.y,(F.campus==='all'?x.c+' · ':'')+x.y+' batch'])],F.batch);F.batch=$('#fBa').value;
 const mx=Math.max(0,...bl.filter(x=>F.batch==='all'||x.c+'|'+x.y===F.batch).map(x=>x.m),...[...ROWS,...CUM].filter(r=>(F.campus==='all'||r.campus===F.campus)&&(F.batch==='all'||r.campus+'|'+r.yr===F.batch)).map(r=>r.n||0));
 fill('#fSm',[['all','All semesters'],...Array.from({length:mx},(_,i)=>[String(i+1),'Semester '+(i+1)])],F.sem);
 F.exam=$('#fEx').value;F.sem=$('#fSm').value}
const stat=(t,u)=>u===0?['bad','Not uploaded']:u===t?['ok','Complete']:['wn','Partial'];
const cnt=(a,k)=>a.filter(r=>r.st===k).length;
function render(){
 const selB=r=>(F.campus==='all'||r.campus===F.campus)&&(F.batch==='all'||r.campus+'|'+r.yr===F.batch);
 const rows=ROWS.filter(r=>(F.exam==='all'||r.ex===F.exam)&&selB(r)&&(F.sem==='all'||String(r.n)===F.sem)),base=[...ROWS.filter(selB),...CUM.filter(selB)];
 $('#meta').textContent='Updated '+new Date(UPD).toLocaleString()+' · '+ROWS.length+' subject-wise and '+CUM.length+' cumulative entries';
 const tot=rows.length,sc=cnt(rows,'scored'),ab=cnt(rows,'absent'),stu=grp(rows,r=>r.id),avgAll=mean(rows.filter(r=>r.st==='scored').map(r=>r.pct));
 const K=(v,l,s)=>`<div class="k"><b>${v}</b><span>${l}</span>${s?`<small>${s}</small>`:''}</div>`;
 $('#kpis').innerHTML=K(new Set(base.map(r=>r.id)).size,'Total students',F.exam==='all'?'':stu.size+' appeared in this exam')+K(tot?((sc+ab)/tot*100).toFixed(0)+'%':'–','Marks uploaded',(sc+ab)+' of '+tot+' entries')+K(pc(avgAll),'Average score',sc+' scored entries');
 const allx=[...ROWS,...CUM].map(r=>r.ex),mn=Math.max(3,...allx.map(e=>+((e.match(/^midterm_(\d+)$/)||[])[1]||0))),mt=[];
 for(let i=1;i<=mn;i++)mt.push('midterm_'+i);
 const gS=grp(ROWS,r=>r.sk+'|'+r.ex),gC=grp(CUM,r=>r.sk+'|'+r.ex);
 const av=e=>{if(!e||!e.length)return['bad','Not available',''];const t=e.length,u=cnt(e,'scored')+cnt(e,'absent'),sj=[...grp(e,r=>r.cid)],sd=sj.filter(([i,x])=>cnt(x,'scored')+cnt(x,'absent')===x.length).length;return[u===t?'ok':u?'wn':'bad',u===t?'Available':u?'Partial':'Not available',sd+'/'+sj.length+' subjects']};
 const avC=e=>{if(!e||!e.length)return['bad','Not available',''];const t=e.length,u=cnt(e,'scored');return[u===t?'ok':u?'wn':'bad',u===t?'Available':u?'Partial':'Not available',u+'/'+t+' students']};
 const bs=[];
 PLAN.forEach(([c,y,m])=>{if((F.campus!=='all'&&F.campus!==c)||(F.batch!=='all'&&F.batch!==c+'|'+y))return;for(let n=1;n<=m;n++)bs.push({campus:c,yr:y,n,sk:c+'|'+y+'|S'+n,mid:n===m})});
 const bl='border-left:1px solid var(--bd)',dash=`<td style="${bl};color:var(--mu)">–</td><td style="color:var(--mu)">–</td>`;
 const T=(id,tc,list)=>{
  $(id).innerHTML=list.length?'<table><tr><th rowspan="2">Campus</th><th rowspan="2">Batch</th><th rowspan="2">Semester</th>'+tc.map(c=>`<th colspan="2" style="text-align:center;${bl}">${esc(exL(c))}</th>`).join('')+'</tr><tr>'+tc.map(()=>`<th style="${bl}">Subject-wise</th><th>Cumulative</th>`).join('')+'</tr>'+list.map(b=>'<tr><td>'+esc(b.campus)+'</td><td>'+b.yr+'</td><td>'+b.n+'</td>'+tc.map(c=>{if(!(c==='endterm'||b.mid))return dash;const x=av(gS.get(b.sk+'|'+c)),m=CUM.length?avC(gC.get(b.sk+'|'+c)):['bad','Not available','file not loaded'],has=gS.has(b.sk+'|'+c);return`<td ${has?`class="clk" data-c="${esc(b.campus)}" data-y="${b.yr}" data-n="${b.n}" data-e="${esc(c)}"`:''} style="${bl}"><span class="chip ${x[0]}">${x[1]}</span><div class="sub">${x[2]}</div></td><td><span class="chip ${m[0]}">${m[1]}</span><div class="sub">${m[2]}</div></td>`}).join('')+'</tr>').join('')+'</table>':'<p class="note">Nothing to show for this filter.</p>';
  document.querySelectorAll(id+' td.clk').forEach(t=>t.onclick=()=>{F.exam=t.dataset.e;F.campus=t.dataset.c;F.batch=t.dataset.c+'|'+t.dataset.y;F.sem=t.dataset.n;opts();render();scrollTo({top:0,behavior:'smooth'})})};
 T('#trkEnd',['endterm'],bs);T('#trkMid',mt,bs.filter(b=>b.mid));
 const sa=[...stu].map(([id,a])=>{const q=a.filter(r=>r.st==='scored');return{id,name:a[0].name,bl:a[0].bl,n:q.length,t:a.length,avg:mean(q.map(r=>r.pct))}}).filter(q=>q.n>=Math.min(2,q.t)&&q.avg!=null);
 const ps=[...sa].sort((x,y)=>tab==='top'?y.avg-x.avg||y.n-x.n:x.avg-y.avg||x.n-y.n).slice(0,10);
 $('#perf').innerHTML='<table><tr><th>#</th><th>Student</th><th>Batch</th><th class="n">Avg</th><th class="n">Subjects</th></tr>'+ps.map((q,i)=>`<tr><td>${i+1}</td><td>${esc(q.name)}</td><td>${esc(q.bl)}</td><td class="n" style="color:${col(q.avg)};font-weight:600">${pc(q.avg)}</td><td class="n">${q.n}/${q.t}</td></tr>`).join('')+'</table>';
 // Student-wise semester funnel (from the cumulative sheet)
 const rk=e=>e==='endterm'?1e6:+((e.match(/\d+/)||[0])[0]),nv=v=>v,fv=v=>pc(v),fm=new Map();
 CUM.filter(r=>r.v!=null&&r.n&&selB(r)&&(F.exam==='all'||r.ex===F.exam)).forEach(r=>{let q=fm.get(r.id);if(!q){q={name:r.name,bl:r.campus+' · '+r.yr+' batch',campus:r.campus,sem:{}};fm.set(r.id,q)}const o=q.sem[r.n];if(!o||rk(r.ex)>rk(o.ex))q.sem[r.n]={v:r.v,ex:r.ex}});
 const fl=[...fm.values()].map(q=>{const sv={};Object.keys(q.sem).forEach(k=>sv[k]=q.sem[k].v);return{name:q.name,bl:q.bl,campus:q.campus,sv,avg:mean(Object.values(sv).map(nv))}}).filter(q=>q.avg!=null).sort((x,y)=>y.avg-x.avg);
 const topOnly=F.campus==='all'&&F.batch==='all',shown=topOnly?fl.slice(0,10):fl;
 const maxS=Math.max(1,...fl.flatMap(q=>Object.keys(q.sv).map(Number))),sems=[];for(let i=1;i<=maxS;i++)sems.push(i);
 const pre=fl.length&&fl.every(q=>q.campus==='SAGESELECT')?'Trimester ':'Sem ';
 $('#funnel').className='w'+(topOnly?'':' fun');
 $('#funnel').innerHTML=!CUM.length?'<p class="note">Cumulative data not loaded.</p>':shown.length?'<table><tr><th>#</th><th>Student</th><th>Batch</th>'+sems.map(i=>`<th style="${bl}">${pre}${i}</th>`).join('')+'<th class="n" style="'+bl+'">Overall</th></tr>'+shown.map((q,i)=>`<tr><td>${i+1}</td><td>${esc(q.name)}</td><td>${esc(q.bl)}</td>`+sems.map(n=>{const v=q.sv[n];return v==null?`<td style="${bl};color:var(--mu)">–</td>`:`<td style="${bl};color:${col(nv(v))};font-weight:600">${fv(v)}</td>`}).join('')+`<td class="n" style="${bl};color:${col(q.avg)};font-weight:700">${pc(q.avg)}</td></tr>`).join('')+'</table>':'<p class="note">No cumulative marks for this filter.</p>';
 $('#funNote').textContent=(topOnly?'Top 10 by overall average. Select a campus or batch to see everyone. ':fl.length+' students, sorted by overall average. ')+'% = obtained ÷ max marks (cumulative sheet). A dash means no marks for that semester.'}
['fEx','fCa','fBa','fSm'].forEach(id=>$('#'+id).onchange=()=>{F.exam=$('#fEx').value;F.campus=$('#fCa').value;F.batch=id==='fCa'?'all':$('#fBa').value;F.sem=id==='fCa'||id==='fBa'?'all':$('#fSm').value;opts();render()});
[['tTop','top'],['tLow','low']].forEach(([id,v])=>$('#'+id).onclick=()=>{tab=v;$('#tTop').className=v==='top'?'on':'';$('#tLow').className=v==='low'?'on':'';render()});
// ===== Loader =====
let LT=null,LP=0;
const LM=p=>p>=100?"Here's your data":p>=90?'Just one second…':p>=75?'Almost loaded…':p>=50?'About to load…':'Data loading…';
function lset(p){LP=p;const w=Math.floor(p);$('#lbar').style.width=p+'%';$('#lpc').textContent=w+'%';$('#ltx').textContent=LM(w)}
function lstart(){clearInterval(LT);$('#ld').hidden=false;lset(0);LT=setInterval(()=>lset(Math.min(99,LP+(LP<50?1.5:LP<75?.6:LP<90?.3:.05))),100)}
function lend(ok){clearInterval(LT);if(!ok){$('#ld').hidden=true;return}lset(100);setTimeout(()=>{$('#ld').hidden=true},700)}
function showLogin(m){$('#app').hidden=true;$('#login').hidden=false;$('#lmsg').textContent=m||'';$('#sb').disabled=false}
async function loadData(fresh){
 $('#lmsg').textContent='';$('#sb').disabled=true;$('#rf').disabled=true;lstart();let ok=false;
 try{
  const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({...CRED,refresh:!!fresh})}),j=await r.json();
  if(j.error){CRED=null;sessionStorage.removeItem('cr');showLogin(j.error);return}
  ROWS=normSub(j.subject);CUM=normCum(j.cumulative);UPD=j.updated;
  PLAN=j.user.role==='admin'?PLAN_ALL:PLAN_ALL.filter(p=>j.user.campuses.includes(p[0].toUpperCase()));
  $('#login').hidden=true;$('#app').hidden=false;$('#err').textContent='';
  $('#who').textContent=j.user.email+' · '+(j.user.role==='admin'?'Admin':'Viewer: '+j.user.campuses.join(', '));
  F={exam:'all',campus:'all',batch:'all',sem:'all'};opts();render();ok=true;
 }catch(e){showLogin('Could not reach the server. Check API_URL and your internet, then try again.')}
 finally{lend(ok);$('#rf').disabled=false}}
$('#sb').onclick=()=>{CRED={email:$('#em').value.trim(),password:$('#pw').value};sessionStorage.setItem('cr',JSON.stringify(CRED));loadData()};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#sb').click()};
$('#rf').onclick=()=>loadData(true);
$('#so').onclick=()=>{CRED=null;sessionStorage.removeItem('cr');$('#pw').value='';showLogin()};
if(CRED&&CRED.email)loadData();else showLogin();
</script></body></html>
